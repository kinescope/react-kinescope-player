# Stages the package on npm when a GitHub Release is published.
#
# - The release tag must be `v<version from package.json>` of the tagged commit.
# - Version with a prerelease part (`0.6.0-beta.0`) goes to the `next` dist-tag and the
#   GitHub Release must be marked as "pre-release"; a stable version goes to `latest`.
# - Auth: npm Trusted Publishing (OIDC), no npm token. The trusted publisher on npmjs.com
#   must point to this repository and this workflow file (`npm-publish.yml`) and allow
#   only `npm stage publish`.
# - Staged publishing: the package is not installable until a package owner approves it
#   with 2FA (npmjs.com → package → Staged Packages, or `npm stage approve <stage-id>`).
#   The stage id is in the job summary.
#
# Third-party code (npm ci, tests, build) runs only in the `build` job, which has no
# id-token; the `stage` job only stages the tarball built there.
name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      dist-tag: ${{ steps.version.outputs.dist-tag }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check tag, version and pre-release flag
        id: version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_NAME" != "v$VERSION" ]; then
            echo "::error::Release tag '$TAG_NAME' does not match package.json version 'v$VERSION'."
            exit 1
          fi
          case "$VERSION" in
            *-*) IS_PRE=true; DIST_TAG=next ;;
            *)   IS_PRE=false; DIST_TAG=latest ;;
          esac
          if [ "$IS_PRE" != "$PRERELEASE" ]; then
            echo "::error::Version '$VERSION' prerelease=$IS_PRE, but GitHub Release pre-release=$PRERELEASE."
            exit 1
          fi
          echo "dist-tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION to '$DIST_TAG'"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Check that committed dist matches the build
        run: git diff --exit-code --stat -- dist

      - name: Pack
        id: pack
        run: |
          TARBALL=$(npm pack --silent | tail -n 1)
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          tar -tzf "$TARBALL"

      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  stage:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC) and provenance
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # latest 24.x ships npm >= 11.15.0 required by `npm stage`
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check npm version
        run: |
          NPM_VERSION=$(npm --version)
          node -e '
            const [major, minor] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && minor < 15)) {
              console.log(`::error::npm ${process.argv[1]} is too old: npm stage publish needs >= 11.15.0.`);
              process.exit(1);
            }
          ' "$NPM_VERSION"
          echo "npm $NPM_VERSION"

      - uses: actions/download-artifact@v8
        with:
          name: package

      - name: Stage
        shell: bash
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}
        # provenance is generated automatically with Trusted Publishing
        run: |
          npm stage publish "./$TARBALL" --access public --tag "$DIST_TAG" | tee stage.log
          STAGE_ID=$(grep -oE 'staged with id [0-9a-fA-F-]+' stage.log | awk '{print $4}' | tail -n 1 || true)
          NAME_VERSION=$(tar -xzOf "$TARBALL" package/package.json | node -e "const p=JSON.parse(require('fs').readFileSync(0));console.log(p.name+'@'+p.version)")
          {
            echo "## Staged $NAME_VERSION (\`$DIST_TAG\`)"
            echo
            echo "The package is not published until a package owner approves it with 2FA:"
            echo
            echo "- npmjs.com → \`@kinescope/react-kinescope-player\` → **Staged Packages** → **Approve**, or"
            if [ -n "$STAGE_ID" ]; then
              echo "- \`npm stage approve $STAGE_ID\` (npm >= 11.15.0, logged in as an owner)."
              echo
              echo "Inspect before approving: \`npm stage view $STAGE_ID\`, \`npm stage download $STAGE_ID\`."
            else
              echo "- \`npm stage list @kinescope/react-kinescope-player\`, then \`npm stage approve <stage-id>\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
